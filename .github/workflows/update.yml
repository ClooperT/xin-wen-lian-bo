name: Update today xin wen lian bo

on:
  workflow_dispatch:

jobs:
  update:
    name: Update today xin wen lian bo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run crawler with retry until 20:00
        run: |
          END_TIME=$(date -d "20:00" +%s 2>/dev/null || date -j -f "%H:%M" "20:00" +%s)
          END_TIME=${END_TIME:-$(date -d "20:00" +%s)}
          while true; do
            npm run index || true
            TODAY=$(TZ='Asia/Shanghai' date +'%Y%m%d')
            if [ -f "news/${TODAY}.md" ]; then
              echo "新闻文件已生成"
              break
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "已超过20:00，停止重试"
              break
            fi
            echo "新闻尚未生成，等待10分钟后重试..."
            sleep 600
          done

      - name: Generate RSS Feed
        run: |
          npm install feed marked
          node build_rss.js || echo "RSS 生成失败或未配置，跳过"

      - name: Send to Feishu Bot
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node feishu_sender.js || true

      - name: Send AI Industry Analysis
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node ai_analysis.js || true

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "AUTO UPDATE [bot]" || true

      - name: Push master changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master

